name: Vigilancia diaria

# Una pasada al día: descarga las fechas nuevas de Sentinel-2, recalcula las alertas,
# regenera el informe y lo publica. Solo procesa lo que falta, así que el trabajo real
# son unas pocas fechas por humedal y no los nueve años de histórico.
#
# A las 06:20 UTC porque las escenas de la mañana tardan varias horas en aparecer como
# L2A en el catálogo: pedirlas a la hora del paso del satélite es pedirlas antes de que
# existan.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:        # y a mano desde la pestaña Actions cuando haga falta

permissions:
  contents: write           # para guardar las series nuevas y publicar en gh-pages

# Dos ejecuciones a la vez se pisarían las series y la rama de publicación.
concurrency:
  group: vigilancia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # La imagen de la última fecha de cada humedal, para que el informe la tenga
      # también los días sin escena nueva. El repo lleva versionada una copia de las
      # seis, así que si la caché se pierde el informe sale con imágenes viejas —cada
      # una con su fecha impresa— en lugar de sin ninguna.
      - uses: actions/cache@v4
        with:
          path: data/img
          key: img-${{ github.run_id }}
          restore-keys: img-

      - name: Descargar fechas nuevas y generar el informe
        run: python -m humedales.cli run

      - name: Guardar las series y las alertas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series data/hydro data/masks
          if git diff --cached --quiet; then
            echo "Sin fechas nuevas que guardar."
          else
            git commit -m "Series al $(date -u +%Y-%m-%d)"
            # Alguien puede haber empujado a mano mientras corría esto.
            git pull --rebase --autostash origin master
            git push origin HEAD:master
          fi

      - name: Publicar el informe
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          fecha=$(date -u +%Y-%m-%d)
          rm -rf publicar && mkdir publicar

          # Se parte de lo que ya está publicado. La rama es un solo commit que se
          # reemplaza en cada pasada, así que reconstruirla desde cero borraría la
          # página de un país que hoy no haya generado informe.
          git -C publicar init -q -b gh-pages
          git -C publicar config user.name "github-actions[bot]"
          git -C publicar config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C publicar remote add origin "https://x-access-token:$TOKEN@github.com/$REPO.git"
          # Se copia el árbol, no se mueve HEAD: con un `reset --soft` a FETCH_HEAD el
          # commit siguiente tendría padre y la rama crecería un commit al día. Así
          # HEAD sigue sin nacer y el commit sale huérfano, que es lo que se quiere.
          if git -C publicar fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git -C publicar checkout -q FETCH_HEAD -- . || true
          else
            echo "Primera publicación: no había rama gh-pages."
          fi

          # Una página por país. España se queda en index.html: es la URL que ya
          # estaba publicada y la que hay enlazada por ahí fuera. Se copia lo que
          # exista y se avisa de lo que falte, en vez de abortar la publicación
          # entera: si un país se queda sin ninguna fecha válida, mejor publicar el
          # informe nuevo del otro y dejar el suyo como estaba ayer.
          while read -r origen destino; do
            if [ -f "output/$origen" ]; then
              cp "output/$origen" "publicar/$destino"
            else
              echo "::warning::falta output/$origen; $destino se queda como estaba"
            fi
          done <<LISTA
          informe_ES_$fecha.html index.html
          informe_FR_$fecha.html france.html
          alertas_$fecha.json alertas.json
          alertas_ES_$fecha.json alertas_es.json
          alertas_FR_$fecha.json alertas_fr.json
          LISTA
          if [ ! -f publicar/index.html ] && [ ! -f publicar/france.html ]; then
            echo "::error::no hay ningún informe que publicar"; exit 1
          fi
          touch publicar/.nojekyll

          cd publicar
          git add -A
          # Un solo commit, siempre reemplazado: cada informe son 2 MB de gráficas
          # incrustadas y su histórico no aporta nada. Las series de las que sale sí
          # están versionadas en master.
          git commit -q -m "Informe del $fecha"
          git push -q --force origin HEAD:gh-pages

      # Las alertas del día, en la propia página de la ejecución: es donde se mira
      # cuando llega un correo de Actions diciendo que algo ha pasado.
      - name: Resumen de la ejecución
        if: always()
        run: |
          {
            echo "### Vigilancia de humedales"
            echo
            if ls output/alertas_[0-9]*.json >/dev/null 2>&1; then
              python - <<'EOF'
          import glob, json
          # El fichero sin país lleva las alertas de los dos, que es lo que interesa aquí.
          alertas = json.load(open(sorted(glob.glob("output/alertas_[0-9]*.json"))[-1], encoding="utf-8"))
          if not alertas:
              print("Sin alertas activas.")
          for a in alertas:
              print(f"- **{a['site']}** · {a['kind']} ({a['severity']}): {a['message']}")
          EOF
            else
              echo "No se generó informe en esta ejecución."
            fi
            echo
            echo "España: https://asensio94.github.io/vigilancia-humedales/"
            echo "Francia: https://asensio94.github.io/vigilancia-humedales/france.html"
          } >> "$GITHUB_STEP_SUMMARY"
